    <h1>¿Que es TIC?</h1>
    <p>TIC significa Tecnologías de la Información y la Comunicación. Se refiere al conjunto de herramientas, redes, dispositivos y programas que permiten crear, almacenar, procesar y transmitir información de forma digital.</p>
